# ─── ShopSense Weekly AI Vendor Advisor ──────────────────────────────────────
# Runs every Monday at 8:00 AM UTC automatically.
# Analyses each vendor's store and emails strategic recommendations.
#
# Required Secrets (set in GitHub → Settings → Secrets → Actions):
#   DATABASE_URL  — PostgreSQL connection string to your production DB
#   SMTP_USER     — Gmail address to send from
#   SMTP_PASS     — Gmail App Password (not your regular password)
#
# To trigger manually: Actions tab → "ShopSense Weekly Agent" → Run workflow
# ─────────────────────────────────────────────────────────────────────────────

name: ShopSense Weekly AI Agent

on:
  schedule:
    # Every Monday at 8:00 AM UTC (1:30 PM IST)
    - cron: "0 8 * * 1"

  # Allow manual triggering from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (print emails, don't send)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  weekly-vendor-analysis:
    name: 📊 Weekly Vendor Analysis & Email
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly AI advisor agent
        run: python agent_weekly.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Use dry_run=true for scheduled runs until you've tested SMTP manually
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}

      - name: Report completion
        if: always()
        run: echo "✅ Weekly AI Agent completed at $(date -u)"
