# ─── ShopSense CI Pipeline ────────────────────────────────────────────────────
# Runs on every push and pull request to 'main'.
#
# Jobs:
#   1. test-backend  — Installs Python deps, runs pytest with SQLite (no DB needed)
#   2. build-frontend — Installs Node deps, runs npm run build (catches TS/lint errors)
# ─────────────────────────────────────────────────────────────────────────────

name: ShopSense CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs when a new commit is pushed (saves CI minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Job 1: Backend Unit Tests ──────────────────────────────────────────────
  test-backend:
    name: 🧪 Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install pytest httpx

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short
        env:
          # Tests use SQLite in-memory — no real DB connection needed
          TESTING: "1"

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/test_shopsense.db
          retention-days: 3

  # ── Job 2: Frontend Build Check ────────────────────────────────────────────
  build-frontend:
    name: 🏗️ Frontend Build (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # Point the frontend at a dummy backend URL for the build step
          VITE_API_URL: http://localhost:8010
