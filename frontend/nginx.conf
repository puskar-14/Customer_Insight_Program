# nginx config — serves React SPA and proxies /api calls to FastAPI backend
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/* requests → FastAPI backend container
    location /api/ {
        proxy_pass http://backend:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy static uploads served by FastAPI
    location /static/ {
        proxy_pass http://backend:8010/static/;
    }

    # React SPA — all unknown paths fall through to index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
