# ─── ShopSense — Docker Compose ──────────────────────────────────────────────
# Starts: PostgreSQL 15, FastAPI backend, React/nginx frontend
#
# Usage:
#   docker-compose up --build         # first run (builds images)
#   docker-compose up -d              # subsequent runs (detached)
#   docker-compose down -v            # stop and remove volumes
#
# All sensitive values should be placed in a .env file (see backend/.env.example)
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: shopsense_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Puskar@2005}
      POSTGRES_DB: shopsense_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsense_backend
    restart: unless-stopped
    environment:
      # Override the hard-coded DB URL in database.py using this env var
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-Puskar@2005}@db:5432/shopsense_db
      SECRET_KEY: ${SECRET_KEY:-shopsense-dev-secret-change-me}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "8010:8010"
    volumes:
      # Mount uploads so they persist across container restarts
      - uploads_data:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy

  # ── React / nginx Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopsense_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  uploads_data:
