# ─── Render.com Blueprint ─────────────────────────────────────────────────────
# Deploy ShopSense to Render.com with one click.
# Docs: https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  - type: web
    name: shopsense-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopsense-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false       # Set manually in Render dashboard
      - key: SMTP_PASS
        sync: false       # Set manually in Render dashboard
    healthCheckPath: /health

  # ── PostgreSQL Database ───────────────────────────────────────────────────
databases:
  - name: shopsense-db
    databaseName: shopsense_db
    user: shopsense_user
    plan: free
